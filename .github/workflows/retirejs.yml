name: JavaScript vulnerability scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  retirejs:
    name: Retire.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan with Retire.js
        run: |
          echo "JavaScript files under the workspace:"
          find . -type f -name '*.js' -not -path './.git/*' | sort
          echo
          echo "Retire.js verbose scan (known libraries and any vulnerabilities):"
          docker run --rm -v "${{ github.workspace }}:/app" gruebel/retirejs:latest --verbose --outputformat json
          echo
          echo "Retire.js passed: no known vulnerable JavaScript libraries were found."
